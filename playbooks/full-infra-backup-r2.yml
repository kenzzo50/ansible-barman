---
- name: Disaster Recovery — Backup Completo da Infraestrutura para o Cloudflare R2
  hosts: all
  become: true
  vars_files:
    - "../group_vars/all/vars.yml"
    - "../group_vars/all/vault.yml"
    - "/home/ers/workspace/ansible-access/group_vars/all/vault_apis.yml"
  vars:
    snapshot_dir: "/var/backups/infra-snapshots"
    r2_infra_retention: 3

  tasks:
    - name: Definir timestamp único e caminhos do snapshot
      ansible.builtin.set_fact:
        backup_ts: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
      run_once: true

    - name: Definir nomes dos arquivos de snapshot
      ansible.builtin.set_fact:
        temp_work_dir: "/tmp/infra_snapshot_{{ backup_ts }}"
        archive_name: "infra_full_snapshot_{{ backup_ts }}.tar.gz"
        dotfiles_archive_name: "home_dotfiles_{{ backup_ts }}.tar.gz.enc"

    - name: Garantir diretório de armazenamento local e temporário
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "ers"
        group: "ers"
        mode: "0750"
      loop:
        - "{{ snapshot_dir }}"
        - "{{ temp_work_dir }}"

    - name: 1. Backup Lógico Completo do PostgreSQL 17 (Todos os Bancos e Roles)
      ansible.builtin.shell:
        cmd: >
          docker exec -i tm_pg_17_edpostgres17 pg_dumpall -U postgres | gzip > {{ temp_work_dir }}/postgresql17_dumpall.sql.gz
      changed_when: true

    - name: 2. Backup Lógico Completo do MySQL 9.0 (Gitea e Schemas de Apps)
      ansible.builtin.shell:
        cmd: >
          docker exec -i tm_mysql_9_0_edmysql9 mysqldump -uroot -proot --all-databases 2>/dev/null | gzip > {{ temp_work_dir }}/mysql9_dumpall.sql.gz
      changed_when: true

    - name: 3. Backup de Diretório e Estrutura do OpenLDAP
      ansible.builtin.shell:
        cmd: |
          docker exec -i tf_openldap slapcat -n 1 > {{ temp_work_dir }}/openldap_users.ldif 2>/dev/null || true
          docker exec -i tf_openldap slapcat -n 0 > {{ temp_work_dir }}/openldap_config.ldif 2>/dev/null || true
      changed_when: true

    - name: 4. Backup de Configurações, Jobs e Segredos do Jenkins
      ansible.builtin.shell:
        cmd: |
          tar -czf {{ temp_work_dir }}/jenkins_essential_data.tar.gz \
            -C /home/ers/workspace/terraform-portal/volumes/jenkins jobs users secrets credentials.xml config.xml 2>/dev/null || true
      changed_when: true

    - name: 5. Backup de Repositórios Bare e Configurações do Gerrit
      ansible.builtin.shell:
        cmd: |
          tar -czf {{ temp_work_dir }}/gerrit_etc_and_git.tar.gz \
            -C /home/ers/workspace/terraform-portal/volumes gerrit_etc gerrit_git 2>/dev/null || true
      changed_when: true

    - name: 6. Backup de Configurações e Repositórios do Gitea
      ansible.builtin.shell:
        cmd: |
          tar -czf {{ temp_work_dir }}/gitea_data.tar.gz \
            -C /home/ers/workspace/terraform-portal/volumes/gitea gitea/conf ssh 2>/dev/null || true
      changed_when: true

    - name: 6b. Backup de Volumes Docker Críticos de Estado Local (Terraform Portal, TimeMachine, Security, Migration)
      ansible.builtin.shell:
        cmd: |
          mkdir -p {{ temp_work_dir }}/local_docker_volumes
          for vol in \
            terraform-portal_terraform-state \
            terraform-portal_portal-data \
            timemachine-portal_timemachine-data \
            terraform-security-portal_security-data \
            migration_migration_data; do
            if docker volume inspect "$vol" >/dev/null 2>&1; then
              ionice -c 3 nice -n 19 docker run --rm \
                -v "${vol}:/source:ro" \
                -v "{{ temp_work_dir }}/local_docker_volumes:/backup" \
                alpine tar -czf "/backup/${vol}.tar.gz" -C /source . 2>/dev/null || true
            fi
          done
      args:
        executable: /bin/bash
      changed_when: true

    - name: 7. Backup Portátil do Banco Telegraf no InfluxDB
      ansible.builtin.shell:
        cmd: |
          docker exec -i tf_influxdb rm -rf /tmp/influx_dr_tmp 2>/dev/null || true
          docker exec -i tf_influxdb influxd backup -portable /tmp/influx_dr_tmp >/dev/null 2>&1
          docker cp tf_influxdb:/tmp/influx_dr_tmp {{ temp_work_dir }}/influxdb_backup
          docker exec -i tf_influxdb rm -rf /tmp/influx_dr_tmp
      changed_when: true

    - name: 8. Gerar Manifesto com Lista de Containers e Hash dos Artefatos
      ansible.builtin.shell:
        cmd: |
          cat << 'EOF' > {{ temp_work_dir }}/MANIFEST.txt
          =======================================================
          CLOUD OPS LAB — DISASTER RECOVERY INFRASTRUCTURE SNAPSHOT
          Data do Backup: $(date -Iseconds)
          Host: $(hostname)
          OS: $(uname -srm)
          Containers Ativos no Momento do Snapshot:
          $(docker ps --format "table {% raw %}{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}{% endraw %}")
          
          Conteúdo do Snapshot:
          - postgresql17_dumpall.sql.gz (Todos os bancos: nexus3, zabbix7, grafana11, migration, keycloak, n8n_db, typebot_db, evolution_db, terraform_security)
          - mysql9_dumpall.sql.gz (Bancos gitea1_22, mysql_app_db)
          - openldap_users.ldif / openldap_config.ldif (Base OpenLDAP dc=erscloudops,dc=org)
          - jenkins_essential_data.tar.gz (Jobs, Pipelines, Users, Secrets, Credentials)
          - gerrit_etc_and_git.tar.gz (Gerrit Git bare repos, reviews, All-Projects, All-Users)
          - gitea_data.tar.gz (Gitea conf, ssh, repos)
          - local_docker_volumes/ (terraform-state, portal-data, timemachine-data, security-data, migration_data)
          - influxdb_backup/ (Métricas históricas Telegraf)
          =======================================================
          EOF
      changed_when: true

    - name: 9. Compactar Snapshot Completo da Infraestrutura
      ansible.builtin.shell:
        cmd: >
          tar -czf {{ snapshot_dir }}/{{ archive_name }}
          -C {{ temp_work_dir }} .
      changed_when: true

    - name: 10. Gerar Checksum SHA256 do Snapshot Consolidado
      ansible.builtin.shell:
        cmd: sha256sum {{ snapshot_dir }}/{{ archive_name }} > {{ snapshot_dir }}/{{ archive_name }}.sha256
      changed_when: true

    - name: 10b. Compactar e Criptografar Dotfiles e Chaves de /home/ers (Arquivo Separado)
      ansible.builtin.shell:
        cmd: |
          tar --exclude='*Cache*' \
              --exclude='*cache*' \
              --exclude='*.log' \
              --exclude='Trash' \
              -czf {{ snapshot_dir }}/home_dotfiles_{{ backup_ts }}.tar.gz \
              -C /home/ers \
              .ansible_vault_pass .bash_aliases .bashrc .cntb.yaml .config/rclone/rclone.conf .copilot .docker .git-templates .gitconfig .gnupg .jira_config .pgpass .profile .ssh .terraform.d .vscode .vscode-shared .cloud-locale-test.skip .wget-hsts 2>/dev/null || true

          # Criptografia forte AES-256-CBC com chave mestra ~/.ansible_vault_pass
          openssl enc -aes-256-cbc -salt -pbkdf2 -in {{ snapshot_dir }}/home_dotfiles_{{ backup_ts }}.tar.gz \
            -out {{ snapshot_dir }}/{{ dotfiles_archive_name }} \
            -pass file:/home/ers/.ansible_vault_pass

          # Remover pacote temporário em texto claro
          rm -f {{ snapshot_dir }}/home_dotfiles_{{ backup_ts }}.tar.gz

          # Checksum SHA256 do pacote cifrado
          sha256sum {{ snapshot_dir }}/{{ dotfiles_archive_name }} > {{ snapshot_dir }}/{{ dotfiles_archive_name }}.sha256
      changed_when: true

    - name: 11. Limpar Diretório Temporário de Extração
      ansible.builtin.file:
        path: "{{ temp_work_dir }}"
        state: absent

    - name: 12. Obter Informações dos Pacotes Consolidados
      ansible.builtin.stat:
        path: "{{ snapshot_dir }}/{{ archive_name }}"
      register: snapshot_stat

    - name: 12b. Obter Informações do Pacote Dotfiles Cifrado
      ansible.builtin.stat:
        path: "{{ snapshot_dir }}/{{ dotfiles_archive_name }}"
      register: dotfiles_stat

    - name: 13. Aplicar Política de Retenção Local (Manter Últimos {{ r2_infra_retention }} Snapshots)
      ansible.builtin.shell:
        cmd: |
          cd {{ snapshot_dir }}
          ls -1t infra_full_snapshot_*.tar.gz 2>/dev/null | tail -n +{{ r2_infra_retention + 1 }} | while read f; do
            rm -f "$f" "$f.sha256"
          done
          ls -1t home_dotfiles_*.tar.gz.enc 2>/dev/null | tail -n +{{ r2_infra_retention + 1 }} | while read f; do
            rm -f "$f" "$f.sha256"
          done
      changed_when: false

    - name: 14. Enviar Pacotes de Snapshot e Dotfiles Cifrados para o Cloudflare R2
      ansible.builtin.shell:
        cmd: |
          python3 -c '
          import os, boto3
          s3 = boto3.client(
              "s3",
              endpoint_url="{{ r2_endpoint }}",
              aws_access_key_id="{{ r2_access_key }}",
              aws_secret_access_key="{{ r2_secret_key }}",
              region_name="auto"
          )
          archive = "{{ snapshot_dir }}/{{ archive_name }}"
          checksum = "{{ snapshot_dir }}/{{ archive_name }}.sha256"
          dotfiles = "{{ snapshot_dir }}/{{ dotfiles_archive_name }}"
          dotfiles_checksum = "{{ snapshot_dir }}/{{ dotfiles_archive_name }}.sha256"
          
          key_archive = "infra-snapshots/" + os.path.basename(archive)
          key_checksum = "infra-snapshots/" + os.path.basename(checksum)
          key_dotfiles = "infra-snapshots/" + os.path.basename(dotfiles)
          key_dotfiles_checksum = "infra-snapshots/" + os.path.basename(dotfiles_checksum)
          
          print("Iniciando upload para Cloudflare R2...")
          s3.upload_file(archive, "{{ r2_bucket }}", key_archive)
          s3.upload_file(checksum, "{{ r2_bucket }}", key_checksum)
          if os.path.exists(dotfiles):
              s3.upload_file(dotfiles, "{{ r2_bucket }}", key_dotfiles)
              s3.upload_file(dotfiles_checksum, "{{ r2_bucket }}", key_dotfiles_checksum)
              print("Upload do pacote cifrado de dotfiles concluído!")
          print("Upload no Cloudflare R2 concluído com sucesso!")
          
          # Política de retenção no Cloudflare R2
          objs = s3.list_objects_v2(Bucket="{{ r2_bucket }}", Prefix="infra-snapshots/")
          if "Contents" in objs:
              infra_archs = [o["Key"] for o in objs["Contents"] if "infra_full_snapshot_" in o["Key"] and o["Key"].endswith(".tar.gz")]
              infra_archs.sort(reverse=True)
              for old_arch in infra_archs[{{ r2_infra_retention }}:]:
                  s3.delete_object(Bucket="{{ r2_bucket }}", Key=old_arch)
                  s3.delete_object(Bucket="{{ r2_bucket }}", Key=old_arch + ".sha256")
                  print("Removido snapshot antigo no R2: " + old_arch)

              dot_archs = [o["Key"] for o in objs["Contents"] if "home_dotfiles_" in o["Key"] and o["Key"].endswith(".tar.gz.enc")]
              dot_archs.sort(reverse=True)
              for old_arch in dot_archs[{{ r2_infra_retention }}:]:
                  s3.delete_object(Bucket="{{ r2_bucket }}", Key=old_arch)
                  s3.delete_object(Bucket="{{ r2_bucket }}", Key=old_arch + ".sha256")
                  print("Removido dotfiles antigo no R2: " + old_arch)
          '
      register: r2_upload_res
      changed_when: true

    - name: 14b. Redundância Multi-Nuvem — Sincronizar com o Google Drive via rclone (Rotação Exata de 3 Cópias)
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          RCLONE_CFG="/home/ers/.config/rclone/rclone.conf"
          GDRIVE_SNAP_DIR="gdrive:ERS-CloudOps/03_Backups_Ubuntu_Local/Snapshots_Infra_e_Bancos"
          GDRIVE_DOT_DIR="gdrive:ERS-CloudOps/03_Backups_Ubuntu_Local/Credenciais_e_Dotfiles_AES256"
          if rclone --config "$RCLONE_CFG" listremotes 2>/dev/null | grep -q "^gdrive:"; then
            echo "Destino 'gdrive:' detectado no rclone. Iniciando upload organizado para ERS-CloudOps..."
            rclone --config "$RCLONE_CFG" --bind 0.0.0.0 mkdir "$GDRIVE_SNAP_DIR" || true
            rclone --config "$RCLONE_CFG" --bind 0.0.0.0 mkdir "$GDRIVE_DOT_DIR" || true
            rclone --config "$RCLONE_CFG" --bind 0.0.0.0 copy --drive-chunk-size 128M --drive-pacer-min-sleep 100ms --retries 5 --low-level-retries 15 --timeout 20m {{ snapshot_dir }}/{{ archive_name }} "$GDRIVE_SNAP_DIR/"
            rclone --config "$RCLONE_CFG" --bind 0.0.0.0 copy --retries 5 {{ snapshot_dir }}/{{ archive_name }}.sha256 "$GDRIVE_SNAP_DIR/"
            if [ -f "{{ snapshot_dir }}/{{ dotfiles_archive_name }}" ]; then
              rclone --config "$RCLONE_CFG" --bind 0.0.0.0 copy --retries 5 {{ snapshot_dir }}/{{ dotfiles_archive_name }} "$GDRIVE_DOT_DIR/"
              rclone --config "$RCLONE_CFG" --bind 0.0.0.0 copy --retries 5 {{ snapshot_dir }}/{{ dotfiles_archive_name }}.sha256 "$GDRIVE_DOT_DIR/"
            fi
            # Retenção rotativa exata de 3 cópias (remove backups antigos E todos os .sha256 órfãos)
            python3 - << 'PYPRUNE'
            import subprocess
            cfg = "/home/ers/.config/rclone/rclone.conf"
            keep = int("{{ r2_infra_retention }}")
            for dst, pref, suf in [
                ("gdrive:ERS-CloudOps/03_Backups_Ubuntu_Local/Snapshots_Infra_e_Bancos", "infra_full_snapshot_", ".tar.gz"),
                ("gdrive:ERS-CloudOps/03_Backups_Ubuntu_Local/Credenciais_e_Dotfiles_AES256", "home_dotfiles_", ".tar.gz.enc"),
            ]:
                r = subprocess.run(["rclone", "--config", cfg, "--bind", "0.0.0.0", "lsf", "--files-only", f"{dst}/"], capture_output=True, text=True, timeout=90)
                if r.returncode != 0:
                    continue
                files = [f.strip() for f in r.stdout.splitlines() if f.strip()]
                mains = sorted([f for f in files if f.startswith(pref) and f.endswith(suf)], reverse=True)
                keep_set = set(mains[:keep]) | {f"{m}.sha256" for m in mains[:keep]}
                for f in files:
                    if f.startswith(pref) and f not in keep_set:
                        subprocess.run(["rclone", "--config", cfg, "--bind", "0.0.0.0", "deletefile", f"{dst}/{f}"], timeout=90, check=False)
                        print("Removido GDrive:", f)
            PYPRUNE
            chown ers:ers "$RCLONE_CFG" && chmod 600 "$RCLONE_CFG" || true
            echo "Sincronização com Google Drive (ERS-CloudOps/) concluída com sucesso!"
          else
            echo "[INFO] Remote 'gdrive:' não configurado no rclone."
          fi
      register: gdrive_sync_res
      changed_when: "'Iniciando upload' in gdrive_sync_res.stdout"

    - name: 15. Registrar Métricas no InfluxDB Local e no InfluxDB-Contabo (Grafana Cloud 24/7) + Enviar E-mail
      ansible.builtin.shell:
        cmd: |
          python3 - << 'PYMET'
          import os, time, smtplib, urllib.request
          from datetime import datetime
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          size_b = int("{{ snapshot_stat.stat.size }}")
          size_mb = round(size_b / (1024 * 1024), 2)
          dot_kb = round(int("{{ dotfiles_stat.stat.size }}") / 1024, 1)
          arch = "{{ archive_name }}"
          now_ts = int(time.time())
          gdrive_ok = 0 if "concluída com sucesso" in """{{ gdrive_sync_res.stdout | default('') }}""" else 1

          # 1. InfluxDB local
          try:
              p_loc = f'infra_r2_snapshot,server=full_infra,bucket={{ r2_bucket }} status=0i,size_bytes={size_b}i,snapshot_name="{arch}"\n'.encode()
              urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8086/write?db=telegraf", data=p_loc, method="POST"), timeout=5)
          except Exception as e:
              print("Aviso Influx local:", e)

          # 2. InfluxDB-Contabo (Grafana Cloud 24/7)
          try:
              lines = [
                  f'backup_dr_status,host=ubuntu-local,job=ubuntu_full_infra,destination=local status=0i,size_bytes={size_b}i,copies=3i,last_run_ts={now_ts}i,last_success_ts={now_ts}i,archive="{arch}"',
                  f'backup_dr_status,host=ubuntu-local,job=ubuntu_full_infra,destination=r2 status=0i,size_bytes={size_b}i,copies=3i,last_run_ts={now_ts}i,last_success_ts={now_ts}i,archive="{arch}"',
                  f'backup_dr_status,host=ubuntu-local,job=ubuntu_full_infra,destination=gdrive status={gdrive_ok}i,size_bytes={size_b if gdrive_ok == 0 else 0}i,copies={3 if gdrive_ok == 0 else 0}i,last_run_ts={now_ts}i,last_success_ts={now_ts if gdrive_ok == 0 else 0}i,archive="{arch}"',
              ]
              url = "http://100.92.196.127:8086/write?db=telegraf_contabo&u=admin&p={{ vault_influxdb_contabo_password }}"
              urllib.request.urlopen(urllib.request.Request(url, data=("\n".join(lines) + "\n").encode(), method="POST"), timeout=10)
              print("Metricas enviadas ao Grafana Cloud (InfluxDB-Contabo)!")
          except Exception as e:
              print("Aviso Influx Contabo:", e)

          # 3. E-mail de confirmação para kenzzo50@gmail.com
          try:
              msg = MIMEMultipart()
              msg["From"] = "ERS CloudOps Local DR <{{ vault_gmail_user }}>"
              msg["To"] = "kenzzo50@gmail.com"
              tag = "🟢 SUCESSO" if gdrive_ok == 0 else "🟡 PARCIAL"
              msg["Subject"] = f"{tag}: Backup Full Infra Ubuntu Local ({size_mb} MB)"
              body = (
                  f"Relatório — Backup Full Infra, Volumes & Dotfiles AES-256 (Ubuntu Local)\n"
                  f"Data/Hora: {datetime.now().strftime('%d/%m/%Y %H:%M:%S')} (America/Sao_Paulo)\n"
                  f"Snapshot: {arch} ({size_mb} MB) | Dotfiles AES-256: {{ dotfiles_archive_name }} ({dot_kb} KB)\n\n"
                  f"Redundâncias 3-2-1 (Rotação Exata de 3 Cópias):\n"
                  f"- Local (/var/backups/infra-snapshots/): OK (3/3)\n"
                  f"- Cloudflare R2 (infra-snapshots/): OK (3/3)\n"
                  f"- Google Drive (ERS-CloudOps/03_Backups_Ubuntu_Local/): {'OK (3/3)' if gdrive_ok == 0 else 'ERRO'}\n"
              )
              msg.attach(MIMEText(body, "plain", "utf-8"))
              srv = smtplib.SMTP("smtp.gmail.com", 587, timeout=15)
              srv.starttls()
              srv.login("{{ vault_gmail_user }}", "{{ vault_gmail_app_password }}")
              srv.sendmail("{{ vault_gmail_user }}", ["kenzzo50@gmail.com"], msg.as_string())
              srv.quit()
              print("Email enviado para kenzzo50@gmail.com")
          except Exception as e:
              print("Aviso Email:", e)
          PYMET
      changed_when: false

    - name: 16. Exibir Resumo Executivo da Operação de Disaster Recovery
      ansible.builtin.debug:
        msg: >
          Snapshot {{ archive_name }} ({{ (snapshot_stat.stat.size / (1024*1024)) | round(2) }} MB)
          e Dotfiles Cifrados {{ dotfiles_archive_name }} ({{ (dotfiles_stat.stat.size / 1024) | round(2) }} KB)
          armazenados no Cloudflare R2 e processados para redundância Multi-Nuvem!
