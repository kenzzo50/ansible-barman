---
- name: Disaster Recovery — Backup Completo da Infraestrutura para o Cloudflare R2
  hosts: all
  become: true
  vars_files:
    - "../group_vars/all/vars.yml"
    - "../group_vars/all/vault.yml"
  vars:
    snapshot_dir: "/var/backups/infra-snapshots"
    r2_infra_retention: 3

  tasks:
    - name: Definir timestamp único e caminhos do snapshot
      ansible.builtin.set_fact:
        backup_ts: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
      run_once: true

    - name: Definir nomes dos arquivos de snapshot
      ansible.builtin.set_fact:
        temp_work_dir: "/tmp/infra_snapshot_{{ backup_ts }}"
        archive_name: "infra_full_snapshot_{{ backup_ts }}.tar.gz"
        dotfiles_archive_name: "home_dotfiles_{{ backup_ts }}.tar.gz.enc"

    - name: Garantir diretório de armazenamento local e temporário
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "ers"
        group: "ers"
        mode: "0750"
      loop:
        - "{{ snapshot_dir }}"
        - "{{ temp_work_dir }}"

    - name: 1. Backup Lógico Completo do PostgreSQL 17 (Todos os Bancos e Roles)
      ansible.builtin.shell:
        cmd: >
          docker exec -i tm_pg_17_edpostgres17 pg_dumpall -U postgres | gzip > {{ temp_work_dir }}/postgresql17_dumpall.sql.gz
      changed_when: true

    - name: 2. Backup Lógico Completo do MySQL 9.0 (Gitea e Schemas de Apps)
      ansible.builtin.shell:
        cmd: >
          docker exec -i tm_mysql_9_0_edmysql9 mysqldump -uroot -proot --all-databases 2>/dev/null | gzip > {{ temp_work_dir }}/mysql9_dumpall.sql.gz
      changed_when: true

    - name: 3. Backup de Diretório e Estrutura do OpenLDAP
      ansible.builtin.shell:
        cmd: |
          docker exec -i tf_openldap slapcat -n 1 > {{ temp_work_dir }}/openldap_users.ldif 2>/dev/null || true
          docker exec -i tf_openldap slapcat -n 0 > {{ temp_work_dir }}/openldap_config.ldif 2>/dev/null || true
      changed_when: true

    - name: 4. Backup de Configurações, Jobs e Segredos do Jenkins
      ansible.builtin.shell:
        cmd: |
          tar -czf {{ temp_work_dir }}/jenkins_essential_data.tar.gz \
            -C /home/ers/workspace/terraform-portal/volumes/jenkins jobs users secrets credentials.xml config.xml 2>/dev/null || true
      changed_when: true

    - name: 5. Backup de Repositórios Bare e Configurações do Gerrit
      ansible.builtin.shell:
        cmd: |
          tar -czf {{ temp_work_dir }}/gerrit_etc_and_git.tar.gz \
            -C /home/ers/workspace/terraform-portal/volumes gerrit_etc gerrit_git 2>/dev/null || true
      changed_when: true

    - name: 6. Backup de Configurações e Repositórios do Gitea
      ansible.builtin.shell:
        cmd: |
          tar -czf {{ temp_work_dir }}/gitea_data.tar.gz \
            -C /home/ers/workspace/terraform-portal/volumes/gitea gitea/conf ssh 2>/dev/null || true
      changed_when: true

    - name: 7. Backup Portátil do Banco Telegraf no InfluxDB
      ansible.builtin.shell:
        cmd: |
          docker exec -i tf_influxdb rm -rf /tmp/influx_dr_tmp 2>/dev/null || true
          docker exec -i tf_influxdb influxd backup -portable /tmp/influx_dr_tmp >/dev/null 2>&1
          docker cp tf_influxdb:/tmp/influx_dr_tmp {{ temp_work_dir }}/influxdb_backup
          docker exec -i tf_influxdb rm -rf /tmp/influx_dr_tmp
      changed_when: true

    - name: 8. Gerar Manifesto com Lista de Containers e Hash dos Artefatos
      ansible.builtin.shell:
        cmd: |
          cat << 'EOF' > {{ temp_work_dir }}/MANIFEST.txt
          =======================================================
          CLOUD OPS LAB — DISASTER RECOVERY INFRASTRUCTURE SNAPSHOT
          Data do Backup: $(date -Iseconds)
          Host: $(hostname)
          OS: $(uname -srm)
          Containers Ativos no Momento do Snapshot:
          $(docker ps --format "table {% raw %}{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}{% endraw %}")
          
          Conteúdo do Snapshot:
          - postgresql17_dumpall.sql.gz (Todos os bancos: nexus3, zabbix7, grafana11, migration, keycloak, n8n_db, typebot_db, evolution_db, terraform_security)
          - mysql9_dumpall.sql.gz (Bancos gitea1_22, mysql_app_db)
          - openldap_users.ldif / openldap_config.ldif (Base OpenLDAP dc=erscloudops,dc=org)
          - jenkins_essential_data.tar.gz (Jobs, Pipelines, Users, Secrets, Credentials)
          - gerrit_etc_and_git.tar.gz (Gerrit Git bare repos, reviews, All-Projects, All-Users)
          - gitea_data.tar.gz (Gitea conf, ssh, repos)
          - influxdb_backup/ (Métricas históricas Telegraf)
          =======================================================
          EOF
      changed_when: true

    - name: 9. Compactar Snapshot Completo da Infraestrutura
      ansible.builtin.shell:
        cmd: >
          tar -czf {{ snapshot_dir }}/{{ archive_name }}
          -C {{ temp_work_dir }} .
      changed_when: true

    - name: 10. Gerar Checksum SHA256 do Snapshot Consolidado
      ansible.builtin.shell:
        cmd: sha256sum {{ snapshot_dir }}/{{ archive_name }} > {{ snapshot_dir }}/{{ archive_name }}.sha256
      changed_when: true

    - name: 10b. Compactar e Criptografar Dotfiles e Chaves de /home/ers (Arquivo Separado)
      ansible.builtin.shell:
        cmd: |
          tar --exclude='*Cache*' \
              --exclude='*cache*' \
              --exclude='*.log' \
              --exclude='Trash' \
              -czf {{ snapshot_dir }}/home_dotfiles_{{ backup_ts }}.tar.gz \
              -C /home/ers \
              .ansible_vault_pass .bash_aliases .bashrc .cntb.yaml .copilot .docker .git-templates .gitconfig .gnupg .jira_config .pgpass .profile .ssh .terraform.d .vscode .vscode-shared .cloud-locale-test.skip .wget-hsts 2>/dev/null || true

          # Criptografia forte AES-256-CBC com chave mestra ~/.ansible_vault_pass
          openssl enc -aes-256-cbc -salt -pbkdf2 -in {{ snapshot_dir }}/home_dotfiles_{{ backup_ts }}.tar.gz \
            -out {{ snapshot_dir }}/{{ dotfiles_archive_name }} \
            -pass file:/home/ers/.ansible_vault_pass

          # Remover pacote temporário em texto claro
          rm -f {{ snapshot_dir }}/home_dotfiles_{{ backup_ts }}.tar.gz

          # Checksum SHA256 do pacote cifrado
          sha256sum {{ snapshot_dir }}/{{ dotfiles_archive_name }} > {{ snapshot_dir }}/{{ dotfiles_archive_name }}.sha256
      changed_when: true

    - name: 11. Limpar Diretório Temporário de Extração
      ansible.builtin.file:
        path: "{{ temp_work_dir }}"
        state: absent

    - name: 12. Obter Informações dos Pacotes Consolidados
      ansible.builtin.stat:
        path: "{{ snapshot_dir }}/{{ archive_name }}"
      register: snapshot_stat

    - name: 12b. Obter Informações do Pacote Dotfiles Cifrado
      ansible.builtin.stat:
        path: "{{ snapshot_dir }}/{{ dotfiles_archive_name }}"
      register: dotfiles_stat

    - name: 13. Aplicar Política de Retenção Local (Manter Últimos {{ r2_infra_retention }} Snapshots)
      ansible.builtin.shell:
        cmd: |
          cd {{ snapshot_dir }}
          ls -1t infra_full_snapshot_*.tar.gz 2>/dev/null | tail -n +{{ r2_infra_retention + 1 }} | while read f; do
            rm -f "$f" "$f.sha256"
          done
          ls -1t home_dotfiles_*.tar.gz.enc 2>/dev/null | tail -n +{{ r2_infra_retention + 1 }} | while read f; do
            rm -f "$f" "$f.sha256"
          done
      changed_when: false

    - name: 14. Enviar Pacotes de Snapshot e Dotfiles Cifrados para o Cloudflare R2
      ansible.builtin.shell:
        cmd: |
          python3 -c '
          import os, boto3
          s3 = boto3.client(
              "s3",
              endpoint_url="{{ r2_endpoint }}",
              aws_access_key_id="{{ r2_access_key }}",
              aws_secret_access_key="{{ r2_secret_key }}",
              region_name="auto"
          )
          archive = "{{ snapshot_dir }}/{{ archive_name }}"
          checksum = "{{ snapshot_dir }}/{{ archive_name }}.sha256"
          dotfiles = "{{ snapshot_dir }}/{{ dotfiles_archive_name }}"
          dotfiles_checksum = "{{ snapshot_dir }}/{{ dotfiles_archive_name }}.sha256"
          
          key_archive = "infra-snapshots/" + os.path.basename(archive)
          key_checksum = "infra-snapshots/" + os.path.basename(checksum)
          key_dotfiles = "infra-snapshots/" + os.path.basename(dotfiles)
          key_dotfiles_checksum = "infra-snapshots/" + os.path.basename(dotfiles_checksum)
          
          print("Iniciando upload para Cloudflare R2...")
          s3.upload_file(archive, "{{ r2_bucket }}", key_archive)
          s3.upload_file(checksum, "{{ r2_bucket }}", key_checksum)
          if os.path.exists(dotfiles):
              s3.upload_file(dotfiles, "{{ r2_bucket }}", key_dotfiles)
              s3.upload_file(dotfiles_checksum, "{{ r2_bucket }}", key_dotfiles_checksum)
              print("Upload do pacote cifrado de dotfiles concluído!")
          print("Upload no Cloudflare R2 concluído com sucesso!")
          
          # Política de retenção no Cloudflare R2
          objs = s3.list_objects_v2(Bucket="{{ r2_bucket }}", Prefix="infra-snapshots/")
          if "Contents" in objs:
              infra_archs = [o["Key"] for o in objs["Contents"] if "infra_full_snapshot_" in o["Key"] and o["Key"].endswith(".tar.gz")]
              infra_archs.sort(reverse=True)
              for old_arch in infra_archs[{{ r2_infra_retention }}:]:
                  s3.delete_object(Bucket="{{ r2_bucket }}", Key=old_arch)
                  s3.delete_object(Bucket="{{ r2_bucket }}", Key=old_arch + ".sha256")
                  print("Removido snapshot antigo no R2: " + old_arch)

              dot_archs = [o["Key"] for o in objs["Contents"] if "home_dotfiles_" in o["Key"] and o["Key"].endswith(".tar.gz.enc")]
              dot_archs.sort(reverse=True)
              for old_arch in dot_archs[{{ r2_infra_retention }}:]:
                  s3.delete_object(Bucket="{{ r2_bucket }}", Key=old_arch)
                  s3.delete_object(Bucket="{{ r2_bucket }}", Key=old_arch + ".sha256")
                  print("Removido dotfiles antigo no R2: " + old_arch)
          '
      register: r2_upload_res
      changed_when: true

    - name: 14b. Redundância Multi-Nuvem — Sincronizar com o Google Drive via rclone
      ansible.builtin.shell:
        cmd: |
          if rclone listremotes 2>/dev/null | grep -q "^gdrive:"; then
            echo "Destino 'gdrive:' detectado no rclone. Iniciando upload para o Google Drive..."
            rclone copy {{ snapshot_dir }}/{{ archive_name }} gdrive:ers-infra-backups/ --progress
            rclone copy {{ snapshot_dir }}/{{ archive_name }}.sha256 gdrive:ers-infra-backups/
            if [ -f "{{ snapshot_dir }}/{{ dotfiles_archive_name }}" ]; then
              rclone copy {{ snapshot_dir }}/{{ dotfiles_archive_name }} gdrive:ers-infra-backups/
              rclone copy {{ snapshot_dir }}/{{ dotfiles_archive_name }}.sha256 gdrive:ers-infra-backups/
            fi
            echo "Sincronização com Google Drive concluída com sucesso!"
          else
            echo "[INFO] Remote 'gdrive:' não configurado no rclone. (Execute 'rclone config' no terminal para ativar sincronização automática com o Google Drive)."
          fi
      register: gdrive_sync_res
      changed_when: "'Iniciando upload' in gdrive_sync_res.stdout"

    - name: 15. Registrar Métrica do Snapshot de Infraestrutura no InfluxDB
      ansible.builtin.shell:
        cmd: >
          curl -s -i -XPOST 'http://127.0.0.1:8086/write?db=telegraf'
          --data-binary "infra_r2_snapshot,server=full_infra,bucket={{ r2_bucket }} status=0i,size_bytes={{ snapshot_stat.stat.size }}i,snapshot_name=\"{{ archive_name }}\""
      changed_when: false

    - name: 16. Exibir Resumo Executivo da Operação de Disaster Recovery
      ansible.builtin.debug:
        msg: >
          Snapshot {{ archive_name }} ({{ (snapshot_stat.stat.size / (1024*1024)) | round(2) }} MB)
          e Dotfiles Cifrados {{ dotfiles_archive_name }} ({{ (dotfiles_stat.stat.size / 1024) | round(2) }} KB)
          armazenados no Cloudflare R2 e processados para redundância Multi-Nuvem!
